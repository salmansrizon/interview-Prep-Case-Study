# Semantic Similarity Engine Configuration
# WHY YAML? Human-readable, commentable, version-controllable.
# Change behaviour here, never in the Python files.

engine:
  name: "semantic_similarity_engine"
  version: "1.0.0"

  # Input/Output paths (relative to the project folder)
  paths:
    raw_dir: "data/raw"
    vector_dir: "data/vectors"
    report_dir: "data/reports"
    corpus_file: "data/raw/corpus.txt"

  # ---- Embedding settings ----
  embedding:
    # WHY float32 and not float64? Half the memory, and no model needs
    # 15 decimal digits of precision for a similarity score.
    # Try "float64" and watch the memory report double.
    dtype: "float32"
    method: "hashing"       # hashing | bag_of_words
    dimensions: 128         # hashing dimension (ignored by bag_of_words)
    lowercase: true
    seed: 42                # reproducibility — every student gets the same numbers

  # ---- Similarity settings ----
  similarity:
    metric: "cosine"        # cosine | dot
    normalize: true         # WHY? unit vectors make dot product == cosine
    top_k: 3                # how many results a search returns

  # ---- Attention demo settings ----
  attention:
    seq_len: 6
    d_k: 16
    causal_mask: true       # lower-triangular: a token cannot see the future
    scale_by_sqrt_dk: true  # set false to watch softmax saturate

  # ---- Benchmark settings ----
  benchmark:
    enabled: true
    n_elements: 1000000     # for the loop-vs-vectorized race
    n_docs: 20000           # synthetic corpus for the search benchmark
    dimensions: 256

  # ---- Skill check ----
  skill_check:
    enabled: true
    strict: false           # true = exit code 1 if any check fails (for CI)
