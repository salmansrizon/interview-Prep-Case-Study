# Data Audit Configuration
# WHY YAML? Human-readable, commentable, version-controllable.

audit:
  name: "data_audit_pipeline"
  version: "1.0.0"

  # Input/Output paths
  paths:
    raw_dir: "data/raw"
    clean_dir: "data/clean"
    report_dir: "data/audit_reports"

  # Data cleaning rules
  cleaning:
    # Missing value thresholds
    drop_column_if_missing_pct: 0.50    # Drop column if >50% missing
    drop_duplicates: true               # Remove exact duplicate rows
    impute_numeric: "median"            # mean | median | mode
    impute_categorical: "mode"          # mode | constant
    impute_constant: "UNKNOWN"           # Used if impute_categorical = constant

    # Outlier detection
    outlier_method: "iqr"               # iqr | zscore | none
    outlier_iqr_multiplier: 1.5         # Standard IQR rule
    outlier_zscore_threshold: 3.0       # Z-score threshold
    outlier_action: "cap"               # cap | remove | flag
    outlier_cap_lower: 0.01             # Lower percentile for capping
    outlier_cap_upper: 0.99             # Upper percentile for capping

    # Data type enforcement
    dtype_mapping:
      customer_id: "string"
      age: "Int64"                      # Nullable integer
      income: "Float64"                 # Nullable float
      signup_date: "datetime64[ns]"
      is_active: "boolean"
      category: "category"

    # Standardization
    standardize_text: true              # Lowercase, strip whitespace
    preserve_case_columns:              # Join keys — never lowercase these
      - customer_id
    standardize_categories:              # Map inconsistent labels (matched case-insensitively)
      "USA": "United States"
      "US": "United States"
      "U.S.": "United States"
      "UNITED STATES": "United States"
      "UK": "United Kingdom"
      "U.K.": "United Kingdom"
      "GB": "United Kingdom"
      "Canada": "Canada"
      "Germany": "Germany"
      "France": "France"
